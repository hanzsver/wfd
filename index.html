<title>오저뭐?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 한 손 앱: 가운데 480px 기둥 · 큰 추천 카드 하나 · 아래 탭 3개 */
:root{
  --bg:#ffffff; --surface:#f4f3f1; --surface2:#ebe9e6; --fg:#1d1b19; --muted:#7c7772; --line:#e6e3df;
  --accent:#ff5b3a; --accent-soft:#ffe9e3; --accent-fg:#ffffff;
  --have:#e8472a; --have-soft:#ffece6; --miss:#6f6a65; --miss-soft:#efedea;
  --left:#7a4fd6; --left-soft:#efe8fd;
  --shadow:0 10px 30px rgba(60,30,10,.08);
  --fridge:#e9e9ec; --fridge-in:#ffffff; --glow:rgba(255,236,190,.9);
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413; --surface:#211f1d; --surface2:#2c2926; --fg:#f3f0ec; --muted:#a29b94; --line:#33302c;
  --accent:#ff7457; --accent-soft:#3a221b; --accent-fg:#1a0d08;
  --have:#ff8166; --have-soft:#3a221b; --miss:#b3aca5; --miss-soft:#2c2926;
  --left:#b79bff; --left-soft:#2a2340; --shadow:0 10px 30px rgba(0,0,0,.35); --fridge:#34312f; --fridge-in:#1c1a19; --glow:rgba(255,230,170,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#211f1d; --surface2:#2c2926; --fg:#f3f0ec; --muted:#a29b94; --line:#33302c;
  --accent:#ff7457; --accent-soft:#3a221b; --accent-fg:#1a0d08;
  --have:#ff8166; --have-soft:#3a221b; --miss:#b3aca5; --miss-soft:#2c2926;
  --left:#b79bff; --left-soft:#2a2340; --shadow:0 10px 30px rgba(0,0,0,.35); --fridge:#34312f; --fridge-in:#1c1a19; --glow:rgba(255,230,170,.10); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-size:26px;line-height:1.1}
.brand em{font-family:var(--f-body);font-style:normal;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;letter-spacing:.02em;vertical-align:4px}
.brand em{font-family:var(--f-body);font-style:normal;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;letter-spacing:.02em;vertical-align:4px}
.brand em{font-family:var(--f-body);font-style:normal;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;letter-spacing:.02em;vertical-align:4px}
.brand em{font-family:var(--f-body);font-style:normal;font-size:12px;font-weight:700;color:var(--accent);margin-left:8px;letter-spacing:.02em;vertical-align:4px}
.brand small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--have)}
.view[hidden]{display:none}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px 0;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* card */
.card{background:var(--surface);border-radius:28px;padding:28px 22px 22px;text-align:center;position:relative;overflow:hidden}
.plate{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);font-size:70px;line-height:1;user-select:none}
.plate.land{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(.7) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--muted)}
.badge.left{background:var(--left-soft);color:var(--left)}
.menu-name{font-family:var(--f-display);font-size:34px;line-height:1.2;margin:10px 0 6px;text-wrap:balance;word-break:keep-all}
.reason{font-size:14px;font-weight:500;color:var(--muted);min-height:21px}
.reason b{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.chip{font-size:13px;font-weight:500;padding:5px 11px;border-radius:99px;background:var(--bg);color:var(--muted)}
.chip.have{background:var(--have-soft);color:var(--have)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}
.chip.left{background:var(--left-soft);color:var(--left)}
.recipe{display:inline-block;margin-top:16px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.actions.one{grid-template-columns:1fr}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:14px}
.btn{height:56px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.done{background:var(--have-soft);color:var(--have)}
.after{margin-top:10px;display:flex;justify-content:center}
.after button{font-size:13px;font-weight:700;color:var(--left);background:var(--left-soft);padding:8px 14px;border-radius:99px}
.empty-card .plate{font-size:56px}
.empty-card p{color:var(--muted);margin:6px 0 16px}
.empty-card .btn{width:100%}

/* summary list */
.sum{margin-top:22px}
.sum-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 4px;font-weight:700;font-size:15px;border-top:1px solid var(--line)}
.sum-head span{color:var(--muted);font-weight:500;font-size:13px}
.sum-head .n{color:var(--accent);font-weight:800}
.mlist{display:grid;gap:2px;padding-bottom:6px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:12px;text-align:left;width:100%}
.mrow:hover{background:var(--surface)}
.mrow .e{font-size:24px;width:32px;text-align:center}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-weight:700;font-size:15px}
.mrow .t span{font-size:12px;color:var(--muted)}
.mrow .tag{font-size:12px;font-weight:700;color:var(--miss);text-align:right;flex-shrink:0;max-width:40%}
.shop{padding:4px 0 16px}
.shop-chips{display:flex;flex-wrap:wrap;gap:6px}
.shop-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px 7px 9px;border-radius:99px;background:var(--miss-soft);color:var(--miss);font-size:14px;font-weight:700}
.shop-chip .ico{width:20px;height:20px}
.shop-chip b{font-weight:800}
.shop-chip.on{background:var(--miss);color:var(--bg)}

/* fridge */
h2{font-size:22px;font-weight:800;margin:4px 0 14px;letter-spacing:-.01em}
.addbox{background:var(--surface);border-radius:20px;padding:14px}
.kind{display:flex;gap:6px;margin-bottom:10px}
.kind button{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted)}
.kind button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;height:48px;border-radius:14px;border:0;background:var(--bg);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.addrow button{height:48px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:800}
.sec{margin-top:24px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.mine{display:flex;flex-wrap:wrap;gap:8px}
.mine .it{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 13px;border-radius:99px;background:var(--have-soft);color:var(--have);font-weight:700;font-size:14px}
.mine .it.lo{background:var(--left-soft);color:var(--left)}
.mine .it small{font-weight:500;opacity:.8;font-size:12px}
.mine .it button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1;opacity:.7}
.mine .it button:hover{opacity:1;background:rgba(0,0,0,.06)}
.none{font-size:14px;color:var(--muted)}
/* 냉장고 */
.fridge-wrap{margin-top:20px;perspective:1100px;overflow:hidden;border-radius:30px;padding:2px}
.fridge{position:relative;background:var(--fridge-in);border:10px solid var(--fridge);border-radius:28px;min-height:280px;transform-style:preserve-3d;
  box-shadow:inset 0 14px 30px -12px var(--glow),0 8px 24px rgba(30,20,10,.08)}
.fridge.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.015)}60%{transform:scale(.995)}}
.shelf{padding:14px 14px 16px;border-bottom:4px solid var(--fridge)}
.shelf:last-of-type{border-bottom:0}
.shelf .sec-t{margin-bottom:8px}
.mine .it .ico{width:22px;height:22px;margin-left:-4px}
.mine .it.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.mine .it.out{animation:out .28s ease forwards}
@keyframes out{to{transform:scale(.2) translateY(-14px);opacity:0}}
.door{position:absolute;inset:-10px;border-radius:28px;background:var(--fridge);transform-origin:left center;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden}
.door .handle{position:absolute;right:22px;top:50%;width:8px;height:90px;margin-top:-45px;border-radius:8px;background:var(--bg);opacity:.8}
.door-logo{font-family:var(--f-display);font-size:22px;color:var(--fg);opacity:.55}
.door.swing{visibility:visible;animation:swing .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes swing{0%{transform:rotateY(0)}25%{transform:rotateY(-8deg)}100%{transform:rotateY(-100deg)}}
.flyer{position:fixed;z-index:20;pointer-events:none;width:44px;height:44px;display:grid;place-items:center;font-size:34px}
.flyer img{width:44px;height:44px}
.ico{display:inline-block;width:1em;height:1em;object-fit:contain;vertical-align:middle}
.plate .ico{width:92px;height:92px}
.mrow .e .ico,.hrow .e .ico{width:30px;height:30px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{padding:7px 12px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:500}
.quick button.on{background:var(--have-soft);color:var(--have);font-weight:700}
.quick.lo button.on{background:var(--left-soft);color:var(--left)}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* history */
.hist{display:grid;gap:4px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.hrow .e{font-size:26px;width:36px;text-align:center}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-size:15px}
.hrow .t span{font-size:12px;color:var(--muted)}
.hrow button{color:var(--muted);font-size:13px;padding:6px 8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.stat div{background:var(--surface);border-radius:18px;padding:14px 16px}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.stat b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted)}
nav button .ic{font-size:22px;filter:grayscale(1);opacity:.55;transition:.15s}
nav button[aria-current="page"]{color:var(--fg)}
nav button[aria-current="page"] .ic{filter:none;opacity:1;transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:9;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">오저뭐?<em>WFD</em></div>
  </header>

  <section class="view" id="v-pick">
    <div class="seg" role="group" aria-label="추천 범위">
      <button id="m-fridge" aria-pressed="false">냉장고 털기</button>
      <button id="m-any" aria-pressed="true">뭐든 좋아</button>
    </div>
    <div id="card"></div>
    <div class="sum" id="sum"></div>
  </section>

  <section class="view" id="v-fridge" hidden>
    <h2>우리 냉장고</h2>
    <div class="addbox">
      <div class="kind" role="group" aria-label="종류">
        <button id="k-ing" aria-pressed="true">재료</button>
        <button id="k-left" aria-pressed="false">남은 음식</button>
      </div>
      <form class="addrow" id="addform">
        <input id="addinput" autocomplete="off" placeholder="재료명을 입력하세요." maxlength="20">
        <button type="submit">넣기</button>
      </form>
    </div>
    <div class="fridge-wrap">
      <div class="fridge" id="fridge">
        <div class="shelf" id="shelf-left">
          <div class="sec-t"><span>남은 음식</span><span id="cnt-left"></span></div>
          <div class="mine" id="mine-left"></div>
        </div>
        <div class="shelf" id="shelf-ing">
          <div class="sec-t"><span>재료</span><span id="cnt-ing"></span></div>
          <div class="mine" id="mine-ing"></div>
        </div>
        <div class="door" id="door"><span class="handle"></span><span class="door-logo">우리 냉장고</span></div>
      </div>
    </div>
    <p class="note">간장 · 고추장 · 된장 · 설탕 · 소금 · 식용유 · 참기름 등 기본 양념은 있는 것으로 계산</p>
    <div class="sec">
      <div class="sec-t"><span>자주 넣는 것</span></div>
      <div id="quick"></div>
    </div>
  </section>

</div>

<nav><div class="in">
  <button data-v="pick" aria-current="page"><span class="ic">🎲</span>추천</button>
  <button data-v="fridge"><span class="ic">🧊</span>냉장고</button>
</div></nav>

function matchAlt(alt,own){return own.find(o=>o===alt||(alt.length>=2&&o.includes(alt)))}
function analyze(m,own=owned()){
  const have=[],miss=[];
  for(const tok of m.ing){
    const alts=tok.split('/');let hit=null;
    for(const a of alts){if(matchAlt(a,own)){hit=a;break}}
    hit?have.push(hit):miss.push(alts.join('/'));
  }
  return {have,miss};
}
function leftMenus(){

}

const SOLO = new Set(['라면','짜파게티','짜파구리','비빔면','들기름막국수','불닭볶음면']);
function pools(){
  const own=owned();
  const cook=MENUS.filter(m=>m.c!=='배달'&&!SOLO.has(m.n)).map(m=>({m,a:analyze(m,own)}));
  return {
    ready:cook.filter(x=>x.a.miss.length===0),
    one:cook.filter(x=>x.a.miss.length===1&&x.a.have.length>=1),
    two:cook.filter(x=>x.a.miss.length===2&&x.a.have.length>=1),
    left:leftMenus().map(m=>({m,a:analyze(m,own)})),
  };
}
function recentEaten(){
  const lim=Date.now()-5*864e5;
  return new Set(S.picks.filter(p=>p.at>lim).map(p=>p.name));
}
function choose(list){
  if(!list.length) return null;
  const eaten=recentEaten(), lastCat=S.cur&&S.cur.m.c;
  const tiers=[
    list.filter(x=>!S.shown.includes(x.m.n)&&!eaten.has(x.m.n)&&x.m.c!==lastCat),
    list.filter(x=>!S.shown.includes(x.m.n)&&!eaten.has(x.m.n)),
    list.filter(x=>x.m.n!==(S.cur&&S.cur.m.n)),
    list,
  ];
  const t=tiers.find(a=>a.length);
  return t[Math.floor(Math.random()*t.length)];
}
function pick(){
  const P=pools();let x=null;
  if(S.mode==='fridge'){
    /* 남은 음식 30% · 바로 가능 45% · 1~2가지만 사면 25% */
    const r=Math.random(), buy=P.one.concat(P.two);
    if(P.left.length&&r<.3) x=choose(P.left);
    if(!x&&P.ready.length&&(r<.75||!buy.length)) x=choose(P.ready);
    if(!x) x=choose(buy);
    if(!x) x=choose(P.ready.concat(P.left));
  }else{
    const all=MENUS.map(m=>({m,a:analyze(m)})).concat(P.left);
    /* 남은 음식이 있으면 가끔 끼워 넣기 */
    if(P.left.length&&Math.random()<.25) x=choose(P.left);
    if(!x) x=choose(all);
  }
  if(x){S.shown.push(x.m.n);if(S.shown.length>25)S.shown.shift()}
  return x;
}

/* ---------- 추천 화면 ---------- */
const SPIN = ['🍜','🍲','🍕','🍗','🍣','🍛','🥟','🌮','🍝','🥘','🍳','🍙','🥗','🍔','🌶️','🥩'];
function reasonOf(x){
  const {m,a}=x;
  if(m.left) return `<b>남은 ${esc(m.left.name)}</b> 해결하기`;
  if(m.c==='배달') return '오늘은 시켜 먹거나 나가서';
  if(!m.ing.length) return '';
  if(!a.miss.length) return '<b>재료 다 있어요</b>';
  if(a.miss.length<=2) return `<b>${a.miss.map(t=>esc(t.split('/')[0])).join(' · ')}</b>만 사면 돼요`;
  return `${a.miss.length}가지 사야 해요`;
}
function cardHTML(x){
  const {m,a}=x;
  const chips=[
    ...(m.left?[`<span class="chip left">남은 ${esc(m.left.name)}</span>`]:[]),
    ...a.have.map(h=>`<span class="chip have">${esc(h)}</span>`),
    ...a.miss.map(h=>`<span class="chip miss">${esc(h)}</span>`),
  ].join('');
  const q=encodeURIComponent(m.c==='배달'?m.n.replace(/ 외식| 배달/,''):m.n+' 레시피');
  const link=m.c==='배달'
    ?`<a class="recipe" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">근처에서 찾기 ↗</a>`
    :`<a class="recipe" href="https://search.naver.com/search.naver?query=${q}" target="_blank" rel="noopener">레시피 보기 ↗</a>`;
  return `<div class="card">
    <div class="plate" id="plate">${ico(m.e)}</div>
    <span class="badge ${m.left?'left':''}">${m.left?'남은 음식':CAT[m.c]||m.c}</span>
    <div class="menu-name">${esc(m.n)}</div>
    <div class="reason">${reasonOf(x)}</div>
    ${chips?`<div class="chips">${chips}</div>`:''}
    ${link}
  </div>
  <div class="actions one"><button class="btn primary" id="again">다른 거</button></div>
  ${m.left?`<div class="after"><button id="usedup">남은 ${esc(m.left.name)} 다 먹었어요 · 냉장고에서 빼기</button></div>`:''}`;
}
function emptyHTML(){
  return `<div class="card empty-card"><div class="plate">${ico('🧊')}</div>
    <div class="menu-name">냉장고가 비어 있어요</div>
    <p>재료나 남은 음식을 넣으면 그걸로 골라 드려요</p>
    <button class="btn primary" id="gofridge">냉장고 채우기</button></div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn ghost" id="goany">뭐든 좋아로 고르기</button></div>`;
}
function bindCard(){
  $('#again')&&($('#again').onclick=()=>{S.touched=true;roll(true)});
  $('#usedup')&&($('#usedup').onclick=()=>{const it=S.cur.m.left;removeItem(it.id);toast(`남은 ${it.name} 뺐어요`);S.cur={...S.cur,m:{...S.cur.m,left:null}};drawCard()});
  $('#gofridge')&&($('#gofridge').onclick=()=>go('fridge'));
  $('#goany')&&($('#goany').onclick=()=>setMode('any'));
}
function drawCard(){
  $('#card').innerHTML=S.cur?cardHTML(S.cur):emptyHTML();bindCard();
}
let spinTimer=null;
function roll(animate){
  S.eaten=false;
  S.cur=pick();
  drawCard();
  drawSum();
  const plate=$('#plate');
  if(!S.cur||!plate||!animate||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  clearInterval(spinTimer);
  const final=S.cur.m.e;let n=0;
  const name=document.querySelector('.menu-name');name.style.opacity='.15';
  spinTimer=setInterval(()=>{
    plate.innerHTML=ico(SPIN[Math.floor(Math.random()*SPIN.length)]);
    if(++n>12){clearInterval(spinTimer);plate.innerHTML=ico(final);plate.classList.remove('land');void plate.offsetWidth;plate.classList.add('land');name.style.opacity='1'}
  },70);
}
function drawSum(){
  const el=$('#sum');
  if(S.mode!=='fridge'||!S.items.length){
    el.innerHTML=`<div class="sum-head" style="cursor:default"><span>모아 둔 메뉴</span><span><span class="n">${MENUS.length}</span>개</span></div>`;return;
  }
  const P=pools();
  const key=t=>t.split('/')[0];
  const now=[...P.left,...P.ready];
  const allBuy=[...P.one,...P.two];
  const need={};allBuy.forEach(x=>x.a.miss.forEach(t=>{need[key(t)]=(need[key(t)]||0)+1}));
  const top=Object.entries(need).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(S.need&&!need[S.need]) S.need=null;
  const buy=S.need?allBuy.filter(x=>x.a.miss.some(t=>key(t)===S.need)):allBuy;
  const rows=[...now,...buy];
  const row=(x,i)=>`<button class="mrow" data-i="${i}"><span class="e">${ico(x.m.e)}</span>
      <span class="t"><b>${esc(x.m.n)}</b><span>${x.m.left?'남은 '+esc(x.m.left.name):(CAT[x.m.c]||'')}</span></span>
      ${x.a.miss.length?`<span class="tag">${x.a.miss.map(t=>'+'+esc(key(t))).join(' ')}</span>`:''}</button>`;
  const head=(k,t,n)=>`<button class="sum-head" data-tog="${k}" aria-expanded="${S.open===k}">${t}<span><span class="n">${n}</span>개 ${S.open===k?'▲':'▼'}</span></button>`;
  el.innerHTML=`${top.length?`<div class="shop"><div class="sec-t"><span>이것만 사면 더 해 먹을 수 있어요</span></div>
      <div class="shop-chips">${top.map(([k,n])=>`<button class="shop-chip ${S.need===k?'on':''}" data-need="${esc(k)}">${ico(itemEmo({name:k,kind:'ing'}))}${esc(k)} <b>+${n}</b></button>`).join('')}</div></div>`:''}
    ${head('now','지금 바로 만들 수 있는 메뉴',now.length)}
    <div class="mlist" ${S.open==='now'?'':'hidden'}>${now.map((x,i)=>row(x,i)).join('')}</div>
    ${head('buy',S.need?`${esc(S.need)}만 있으면`:'1~2가지만 사면 되는 메뉴',buy.length)}
    <div class="mlist" ${S.open==='buy'?'':'hidden'}>${buy.map((x,i)=>row(x,now.length+i)).join('')}</div>`;
  el.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{S.open=S.open===b.dataset.tog?null:b.dataset.tog;drawSum()});
  el.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>{S.need=S.need===b.dataset.need?null:b.dataset.need;S.open='buy';drawSum()});
  el.querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{const x=rows[+b.dataset.i];S.eaten=false;S.cur={m:x.m,a:x.a};drawCard();window.scrollTo({top:0,behavior:'smooth'})});
}
function setMode(m){
  S.mode=m;S.touched=true;
  $('#m-fridge').setAttribute('aria-pressed',m==='fridge');
  $('#m-any').setAttribute('aria-pressed',m==='any');
  if(m==='fridge'&&!S.items.length){S.cur=null;drawCard();drawSum();return}
  roll(true);
}

/* ---------- 냉장고 화면 ---------- */
function ago(t){const d=Math.floor((Date.now()-t)/864e5);return d<=0?'오늘':d+'일째'}
function drawFridge(){
  const ing=S.items.filter(i=>i.kind==='ing').sort((a,b)=>b.at-a.at);
  const lo=leftovers().sort((a,b)=>b.at-a.at);
  const chip=(i,cls)=>`<span class="it ${cls} ${S.pop&&norm(S.pop)===norm(i.name)?'pop':''}" data-id="${esc(i.id)}">${ico(itemEmo(i))}${esc(i.name)}${cls?` <small>${ago(i.at)}</small>`:''}<button aria-label="${esc(i.name)} 빼기" data-del="${esc(i.id)}">✕</button></span>`;
  $('#mine-left').innerHTML=lo.length?lo.map(i=>chip(i,'lo')).join(''):'<span class="none">피자 · 치킨처럼 남은 게 있으면 넣어 두세요</span>';
  $('#mine-ing').innerHTML=ing.length?ing.map(i=>chip(i,'')).join(''):'<span class="none">아직 없어요</span>';
  $('#cnt-left').textContent=lo.length?lo.length+'개':'';
  $('#cnt-ing').textContent=ing.length?ing.length+'개':'';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>takeOut(b.dataset.del));
  if(S.pop&&document.querySelector('.it.pop')) S.pop=null;
  const ownN=new Set(ing.map(i=>norm(i.name))), loN=new Set(lo.map(i=>norm(i.name)));
  const grp=(t,list,set,cls)=>`<div class="sec-t" style="margin-top:14px"><span>${t}</span></div><div class="quick ${cls}">${list.map(n=>`<button class="${set.has(norm(n))?'on':''}" data-q="${esc(n)}" data-k="${cls?'left':'ing'}">${esc(n)}</button>`).join('')}</div>`;
  $('#quick').innerHTML=(S.kind==='left'
    ?grp('남은 음식',QUICK_LEFT,loN,'lo')
    :Object.entries(QUICK).map(([t,l])=>grp(t,l,ownN,'')).join(''));
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>toggleQuick(b.dataset.q,b.dataset.k,b));
  document.querySelector('nav [data-v="fridge"]').lastChild.textContent=S.items.length?`냉장고 ${S.items.length}`:'냉장고';
}
function toggleQuick(name,kind,from){
  const ex=S.items.find(i=>i.kind===kind&&norm(i.name)===norm(name));
  if(ex) takeOut(ex.id); else {flyIn(name,kind,from);addItem(name,kind)}
}
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyIn(name,kind,from){
  S.pop=name;
  if(calm()||!from) return;
  const shelf=$(kind==='left'?'#mine-left':'#mine-ing');
  const a=from.getBoundingClientRect(), b=shelf.getBoundingClientRect();
  const f=document.createElement('div');f.className='flyer';f.innerHTML=ico(itemEmo({name,kind}));
  document.body.appendChild(f);
  const x0=a.left+a.width/2-22,y0=a.top+a.height/2-22,x1=b.left+Math.min(b.width-40,40+Math.random()*(b.width-80)),y1=b.top+b.height/2-22;
  const lift=Math.min(y0,y1)-90;
  f.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${(x0+x1)/2}px,${lift}px) scale(1.3) rotate(-12deg)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.5) rotate(8deg)`,opacity:.6}],{duration:650,easing:'cubic-bezier(.4,0,.3,1)'}).onfinish=()=>{f.remove();const fr=$('#fridge');fr.classList.remove('bump');void fr.offsetWidth;fr.classList.add('bump')};
}
function takeOut(id){
  const el=document.querySelector(`.it[data-id="${CSS.escape(id)}"]`);
  if(!el||calm()){removeItem(id);return}
  el.classList.add('out');setTimeout(()=>removeItem(id),260);
}
function openDoor(){
  const d=$('#door');if(calm())return;
  d.classList.remove('swing');void d.offsetWidth;d.classList.add('swing');
}
function setKind(k){
  S.kind=k;
  $('#k-ing').setAttribute('aria-pressed',k==='ing');$('#k-left').setAttribute('aria-pressed',k==='left');
  $('#addinput').placeholder=k==='ing'?'재료명을 입력하세요.':'남은 음식을 입력하세요.';
  drawFridge();
}

function drawHist(){}

/* ---------- 저장소 (공유 db · 없으면 이 기기) ---------- */
const LS='dinner-local-v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');S.items=d.items||[];S.picks=d.picks||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:S.items,picks:S.picks}))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function failed(e){toast(e&&e.code==='invalid_argument'?'보기 권한이라 저장할 수 없어요':'저장하지 못했어요. 다시 눌러 주세요')}
async function addItem(raw,kind){
  const name=String(raw).trim().slice(0,20);if(!name) return;
  if(S.items.some(i=>i.kind===kind&&norm(i.name)===norm(name))){toast(`${name}은(는) 이미 있어요`);return}
  const doc={name,kind,at:Date.now()};
  if(store){try{await store.collection('fridge').add(doc)}catch(e){failed(e)}}
  else{S.items.push({id:uid(),...doc});saveLocal();refresh()}
}
async function removeItem(id){
  if(store){try{await store.doc('fridge/'+id).delete()}catch(e){failed(e)}}
  else{S.items=S.items.filter(i=>i.id!==id);saveLocal();refresh()}
}
async function addPick(p){
  if(store){try{await store.collection('picks').add(p)}catch(e){failed(e)}}
  else{S.picks.push({id:uid(),...p});saveLocal();drawHist()}
}
async function removePick(id){
  if(store){try{await store.doc('picks/'+id).delete()}catch(e){failed(e)}}
  else{S.picks=S.picks.filter(p=>p.id!==id);saveLocal();drawHist()}
}
let firstData=true;
function refresh(){
  drawFridge();drawHist();
  if(firstData){firstData=false;
    if(!S.touched&&S.items.length){S.mode='fridge';$('#m-fridge').setAttribute('aria-pressed','true');$('#m-any').setAttribute('aria-pressed','false');roll(false);return}
  }
  /* 지금 카드의 재료 표시만 새로 */
  if(S.cur&&!S.cur.m.left) S.cur={m:S.cur.m,a:analyze(S.cur.m)};
  if(S.mode==='fridge'&&!S.cur&&S.items.length) roll(false); else drawCard();
  drawSum();
}
function setSync(){}
async function connect(){
  let db=null;
  /* GitHub Pages 판: Firestore 의 rooms/<방>/ 아래를 같이 씀 */
  if(window.FB_CONFIG&&window.firebase){
    try{
      firebase.initializeApp(window.FB_CONFIG);
      const root=firebase.firestore().collection('rooms').doc(window.FB_ROOM);
      db={collection:n=>root.collection(n),doc:p=>{const [c,id]=p.split('/');return root.collection(c).doc(id)}};
    }catch(e){db=null}
  }
  if(!db) try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){loadLocal();setSync(false,'이 기기에만 저장');refresh();return}
  store=db;setSync(true,'같이 쓰는 중');
  let gotItems=false;
  db.collection('fridge').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));gotItems=true;refresh()},
    ()=>setSync(false,'연결 끊김'));
  db.collection('picks').orderBy('at','desc').limit(100).onSnapshot(s=>{S.picks=s.docs.map(d=>({id:d.id,...d.data()}));drawHist()},()=>{});
}

/* ---------- 공통 ---------- */
let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===v)||b.dataset.v===v&&b.setAttribute('aria-current','page'));
  if(v==='pick'&&S.mode==='fridge') {S.cur&&!S.cur.m.left&&(S.cur={m:S.cur.m,a:analyze(S.cur.m)});if(!S.cur&&S.items.length)roll(false);else drawCard();drawSum()}
  if(v==='fridge') openDoor();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#m-fridge').onclick=()=>setMode('fridge');
$('#m-any').onclick=()=>setMode('any');
$('#k-ing').onclick=()=>setKind('ing');
$('#k-left').onclick=()=>setKind('left');
$('#addform').addEventListener('submit',e=>{e.preventDefault();const v=$('#addinput').value.trim();$('#addinput').value='';if(!v)return;if(!S.items.some(i=>i.kind===S.kind&&norm(i.name)===norm(v)))flyIn(v,S.kind,$('#addinput'));addItem(v,S.kind)});
const now=new Date();
roll(false);drawFridge();drawHist();
connect();
</script>

</body>
